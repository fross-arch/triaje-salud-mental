# ===================================================================
# CONFIGURACIÓN DEL BACKEND POR CAPAS: TRIAJE DE SALUD MENTAL
# ===================================================================

spring.application.name=triaje-salud-mental-capas
server.port=8080

# Importación de archivo .env
spring.config.import=optional:file:../.env[.properties]

# Conexión a Base de Datos MariaDB de XAMPP / MySQL
spring.datasource.url=jdbc:mysql://localhost:${BD_PUERTO:3306}/${MYSQL_DATABASE:triaje_salud_mental_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${BD_USUARIO:root}
spring.datasource.password=${BD_CLAVE:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false

# Errores en servidor sin mensaje, trazas ni excepción
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Niveles de registro (Logging)
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=OFF
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.apache.coyote=INFO
logging.level.org.apache.tomcat=INFO

# Seguridad Administrador Inicial (sin valor por defecto)
seguridad.admin.correo=${ADMIN_CORREO}
seguridad.admin.contrasena-inicial=${ADMIN_CONTRASENA_INICIAL}

# Seguridad JWT (sin valor por defecto para secreto)
triaje.seguridad.jwt.secreto=${JWT_SECRETO}
seguridad.jwt.secreto=${JWT_SECRETO}
triaje.seguridad.jwt.emisor=triaje-salud-mental
seguridad.jwt.emisor=triaje-salud-mental
triaje.seguridad.jwt.duracion-token-acceso=15m
seguridad.jwt.duracion-minutos=15

# Cookie y Renovación de Sesión
triaje.seguridad.renovacion.duracion=7d
seguridad.renovacion.duracion-dias=7
triaje.seguridad.renovacion.nombre-cookie=token_renovacion
seguridad.renovacion.nombre-cookie=token_renovacion
triaje.seguridad.renovacion.ruta-cookie=/api/autenticacion
seguridad.renovacion.ruta-cookie=/api/autenticacion
triaje.seguridad.renovacion.cookie-segura=${COOKIE_SEGURA:false}
seguridad.renovacion.cookie-segura=${COOKIE_SEGURA:false}

# CORS (Frontend React + Vite)
triaje.seguridad.cors.origenes-permitidos[0]=http://localhost:5173
triaje.seguridad.cors.origenes-permitidos=http://localhost:5173
seguridad.cors.origenes-permitidos=http://localhost:5173

# Límite de intentos y seguridad de contraseñas
triaje.seguridad.limite-intentos.capacidad-por-ip=20
triaje.seguridad.limite-intentos.capacidad-por-correo-e-ip=5
triaje.seguridad.limite-intentos.periodo=1m
triaje.seguridad.bcrypt-fuerza=12
seguridad.bcrypt.fuerza=12

# Microservicio de Reportes Python FastAPI (sin valor por defecto para clave interna)
triaje.reportes.url=${TRIAJE_REPORTES_URL:http://127.0.0.1:8000}
reportes.url=${TRIAJE_REPORTES_URL:http://127.0.0.1:8000}
triaje.reportes.clave-interna=${CLAVE_INTERNA}
reportes.clave-interna=${CLAVE_INTERNA}
triaje.reportes.tiempo-espera-conexion-segundos=5
triaje.reportes.tiempo-espera-lectura-segundos=15
reportes.tiempo-espera-segundos=15

# Tareas programadas (Cron)
triaje.cron-evaluaciones-abandonadas=0 0 * * * *
triaje.cron-citas-expiradas=0 */10 * * * *

# Catálogo de recursos de ayuda en crisis
triaje.recursos-ayuda[0].nombre=Linea 123
triaje.recursos-ayuda[0].telefono=123
triaje.recursos-ayuda[0].horario=24/7
triaje.recursos-ayuda[0].descripcion=Emergencias medicas y situaciones de crisis vital inmediata.
triaje.recursos-ayuda[0].ambito=Nacional (Colombia)

triaje.recursos-ayuda[1].nombre=Linea 192 opcion 4
triaje.recursos-ayuda[1].telefono=192 opcion 4
triaje.recursos-ayuda[1].horario=24/7
triaje.recursos-ayuda[1].descripcion=Orientacion y atencion en salud mental del Ministerio de Salud.
triaje.recursos-ayuda[1].ambito=Nacional (Colombia)

triaje.recursos-ayuda[2].nombre=Linea Amiga Saludable Medellin
triaje.recursos-ayuda[2].telefono=106 / (604) 444 44 48
triaje.recursos-ayuda[2].horario=24/7
triaje.recursos-ayuda[2].descripcion=Acompanamiento psicosocial y prevencion del suicidio de la Alcaldia de Medellin.
triaje.recursos-ayuda[2].ambito=Medellin y area metropolitana

# Tablero estadístico administrativo
triaje.tablero.minimo-grupo=5
triaje.tablero.modo-demo=false

