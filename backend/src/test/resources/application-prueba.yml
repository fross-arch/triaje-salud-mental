spring:
  datasource:
    url: jdbc:mysql://${BD_HOST:localhost}:${BD_PUERTO:3307}/triaje_prueba_db?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER:triaje_app}
    password: ${MYSQL_PASSWORD:Targaryen2026++}
 
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.web.filter.CommonsRequestLoggingFilter: OFF
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.apache.coyote: INFO
    org.apache.tomcat: INFO

triaje:
  seguridad:
    jwt:
      # Secreto exclusivo de pruebas (no se usa en ningún otro entorno).
      secreto: secreto-de-pruebas-solo-para-testcontainers-0123456789
    limite-intentos:
      capacidad-por-ip: 1000
      capacidad-por-correo-e-ip: 5
      periodo: 1m
    bcrypt-fuerza: 4
  reportes:
    url: http://localhost:8000
    clave-interna: clave_interna_prueba_secreta
    tiempo-espera-conexion-segundos: 2
    tiempo-espera-lectura-segundos: 5
